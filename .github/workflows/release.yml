name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Create a GitHub release (otherwise only build artifacts)"
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            deb_arch: amd64
            runner: ubuntu-22.04
          - arch: aarch64
            deb_arch: arm64
            runner: ubuntu-22.04-arm
    # Ubuntu 22.04 (glibc 2.35) keeps the binaries compatible with most distributions.
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libfontconfig1-dev \
            libfreetype-dev libexpat1-dev libdbus-1-dev rpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.arch }}

      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-deb,cargo-generate-rpm

      - name: Build release binary
        run: cargo build --release --locked

      - name: Smoke test
        run: ./target/release/github-redesktop --version

      - name: Package tarball
        run: just tarball ${{ matrix.arch }}

      - name: Package .deb
        run: cargo deb --no-build --no-strip --locked --output dist/

      - name: Package .rpm
        run: cargo generate-rpm --output dist/

      - name: Verify packages
        run: |
          ls -la dist
          dpkg-deb --info dist/*.deb
          rpm -qip dist/*.rpm
          tar -tzf dist/*.tar.gz

      - uses: actions/upload-artifact@v5
        with:
          name: packages-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Release notes
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          cat > notes.md <<NOTES
          ## Install

          | Format | x86_64 | aarch64 |
          |---|---|---|
          | Debian / Ubuntu (.deb) | \`github-redesktop_${version}-1_amd64.deb\` | \`github-redesktop_${version}-1_arm64.deb\` |
          | Fedora / openSUSE (.rpm) | \`github-redesktop-${version}-1.x86_64.rpm\` | \`github-redesktop-${version}-1.aarch64.rpm\` |
          | Any distro (.tar.gz) | \`github-redesktop-${version}-linux-x86_64.tar.gz\` | \`github-redesktop-${version}-linux-aarch64.tar.gz\` |
          | NixOS | \`nix run github:${{ github.repository }}\` | same |

          \`\`\`sh
          # Debian / Ubuntu
          sudo apt install ./github-redesktop_${version}-1_amd64.deb
          # Fedora
          sudo dnf install ./github-redesktop-${version}-1.x86_64.rpm
          # Tarball (installs to ~/.local)
          tar xzf github-redesktop-${version}-linux-x86_64.tar.gz && ./github-redesktop-${version}-linux-x86_64/install.sh
          \`\`\`
          NOTES

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', github.run_number) }}
          body_path: notes.md
          generate_release_notes: true
          draft: ${{ github.ref_type != 'tag' }}
          files: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/SHA256SUMS
